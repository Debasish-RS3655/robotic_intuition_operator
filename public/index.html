<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RIO — Expressions (fullscreen)</title>
  <style>
    :root {
      --mic-size:56px;
      --mic-color:#1f6feb;
      --mic-shadow: 0 6px 16px rgba(31,111,235,0.25);
      --white: #ffffff;
      --black: #000000;
    }

    /* page background white */
    html,body{ height:100%; margin:0; background:var(--white); font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial; color:var(--black); }

    /* split the viewport into two equal rows for the two GIF areas */
    .container{
      height:100vh;
      display:grid;
      grid-template-rows: 1fr 1fr;
      overflow:hidden;
    }

    /* area for eyes / mouth GIFs
       use background-image set by expressions.js (it writes background CSS),
       make them cover as much as possible while preserving aspect ratio */
    .area{
      width:100%;
      height:100%;
      background-position:center;
      background-repeat:no-repeat;
      background-size:contain;
      /* no borders or colored backgrounds */
      background-color: transparent;
    }

    /* mic button placed at nose position (center horizontally;
       around the row boundary). Keep it small & blue. */
    #mic-toggle {
      position:fixed;
      left:50%;
      top:50%;
      transform: translate(-50%, -40%); /* tweak so the button sits slightly into the lower half (nose) */
      width:var(--mic-size);
      height:var(--mic-size);
      border-radius:50%;
      border:0;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:20px;
      color:var(--white);
      background:var(--mic-color);
      box-shadow:var(--mic-shadow);
      cursor:pointer;
      z-index:999;
      outline:none;
    }
    /* active visual state when script toggles */
    #mic-toggle.active {
      box-shadow: 0 8px 28px rgba(31,111,235,0.45), 0 0 0 6px rgba(31,111,235,0.12);
    }

    /* small speech area between eyes and mouth (below nose) */
    .speech-display {
      position:fixed;
      left:50%;
      /* place it between the halves and slightly below the mic (nose) */
      top:58%;
      transform: translate(-50%, -50%);
      min-width:220px;
      max-width:60%;
      padding:8px 12px;
      /* box must be white only (as requested) - no colored borders or backgrounds */
      background:var(--white); /* same as page bg */
      color:var(--black);      /* detected texts black */
      text-align:center;
      z-index:995;
      pointer-events:none; /* non-interactive so it doesn't block clicks on mic */
      /* no border, no shadow, completely minimal */
    }

    .speech-display .final {
      display:block;
      font-weight:600;
      font-size:14px;
      line-height:1.1;
      color:var(--black);
      margin-bottom:4px;
      word-break:break-word;
    }
    .speech-display .interim {
      display:block;
      font-size:13px;
      color:var(--black);
      opacity:0.75; /* still black but slightly subdued visually */
      word-break:break-word;
    }

    /* Keep other UI elements that expressions.js expects present but visually hidden */
    .visually-hidden {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    /* ensure no scrollbars or selection artifacts */
    ::selection { background: transparent; color: var(--black); }
    body::-webkit-scrollbar{ display:none; }
  </style>
</head>
<body>

  <!-- container: top = eyes, bottom = mouth -->
  <div class="container" aria-hidden="true">
    <div id="emotion_area" class="area" role="img" aria-label="Eyes"></div>
    <div id="speech_area" class="area" role="img" aria-label="Mouth"></div>
  </div>

  <!-- small mic button (id matches your expressions.js) -->
  <button id="mic-toggle" title="Toggle mic">🎤</button>

  <!-- speech display (white area with black text) placed between eyes and mouth below the nose -->
  <div class="speech-display" aria-live="polite" aria-atomic="true">
    <span class="final" id="speech"></span>
    <span class="interim" id="interim"></span>
  </div>

  <!-- elements your expressions.js expects but hidden so page stays minimal -->
  <div class="visually-hidden">
    <button id="start-btn" class="startBtn">Start</button>
    <button id="send-btn">Send</button>
    <input id="text-input" type="text" placeholder="Type and press Enter…" />
    <div id="log" class="log" aria-hidden="true"></div>
  </div>

  <!-- keep using your external JS file -->
  <script src="/expressions.js" defer></script>
</body>
</html>
